name: CI

# Default-triggers on every PR (all base branches) plus pushes to main.
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref: a new push to a PR cancels the stale run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Unit + integration tests on every platform vt ships to. macos-latest is the
  # one that actually exercises the `cfg(target_os = "macos")` module
  # (server_macos: SSH agent, keychain, the RSA sign/verify regression test) —
  # that code and its `rsa`/`sha1` deps don't compile on Linux at all.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Test
        run: cargo test --locked --all-targets

      # Runs on both legs on purpose: the ubuntu leg never compiles
      # `src/server_macos/**`, so macos-latest is the only place that module
      # is ever linted at all.
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      # Mirror `just check`: host + the x86_64-unknown-linux-gnu boundary that
      # CLAUDE.md requires to stay green. Only meaningful on Linux.
      - name: Type-check host + linux-gnu boundary
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo check --locked
          cargo check --locked --target x86_64-unknown-linux-gnu

      - name: Test native agent lifecycle (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          TEST_BIN="$RUNNER_TEMP/vt-lifecycle-tests"
          swiftc -D VT_LIFECYCLE_TEST app/VTShell.swift -o "$TEST_BIN"
          "$TEST_BIN"

      - name: Package and verify VT.app (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install just
          just app
          codesign --verify --deep --strict build/VT.app
          build/VT.app/Contents/MacOS/vt version
          build/VT.app/Contents/MacOS/vt --help

  # The cf-worker is half the system (it verifies every ceremony) but ships via
  # `wrangler deploy` with no compile gate of its own. Type-check it on every PR
  # so a TS error in the DO / WebAuthn / Access path can't reach production.
  worker:
    name: cf-worker (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cf-worker/package-lock.json

      - name: Install deps
        working-directory: cf-worker
        run: npm ci --include=dev

      - name: Type-check (tsc --noEmit)
        working-directory: cf-worker
        run: node_modules/.bin/tsc --noEmit

      - name: Unit tests (vitest)
        working-directory: cf-worker
        run: npm test

  # The shipping artifact is a musl-static binary (see justfile `build-musl`).
  # Build it in CI so musl-specific link regressions (the ring/CRT segfault the
  # justfile warns about) surface on PRs, not at release time.
  build-musl:
    name: build (linux musl-static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Use the same compiler flags and lockfile policy as release packaging.
      - name: Build (musl-static)
        run: just build-musl

      - name: Smoke-test shipping binary (including TLS)
        run: node .github/scripts/smoke-binary.mjs target/x86_64-unknown-linux-musl/release/vt
