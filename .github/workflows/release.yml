name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: vt-darwin-arm64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: vt-linux-amd64

    env:
      VERSION: ${{ github.ref_name }}
      # Source of truth for the binary's own version: shallow CI checkouts may
      # lack the tag object for `git describe`, so stamp it from the tag name.
      VT_VERSION_OVERRIDE: ${{ github.ref_name }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: just build-musl

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build --locked --release --bin vt --target ${{ matrix.target }}

      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 22

      - name: Smoke-test shipping binary (Linux, including TLS)
        if: matrix.os == 'ubuntu-latest'
        run: node .github/scripts/smoke-binary.mjs target/${{ matrix.target }}/release/vt

      - name: Smoke-test shipping binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          target/${{ matrix.target }}/release/vt version
          target/${{ matrix.target }}/release/vt --help

      - name: Package binary
        run: |
          chmod +x target/${{ matrix.target }}/release/vt
          tar czf ${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz -C target/${{ matrix.target }}/release vt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ env.VERSION }}
          path: ${{ matrix.artifact }}-${{ env.VERSION }}.tar.gz

      # macOS also ships the menu-bar VT.app (ad-hoc signed) alongside the
      # bare `vt` binary. `just app` is the single source of the bundle
      # layout; VT_APP_BIN reuses the binary just built (no second compile).
      # tar.gz to match the binary artifacts; CLI extraction (`tar xzf`)
      # avoids the Gatekeeper quarantine that Finder/zip would propagate.
      - name: Package VT.app (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          VT_APP_BIN="target/${{ matrix.target }}/release/vt" just app
          codesign --verify --deep --strict build/VT.app
          COPYFILE_DISABLE=1 tar czf VT-app-darwin-arm64-${{ env.VERSION }}.tar.gz -C build VT.app

      - name: Upload VT.app artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: VT-app-darwin-arm64-${{ env.VERSION }}
          path: VT-app-darwin-arm64-${{ env.VERSION }}.tar.gz

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              sha256sum "$file" >> ../checksums.txt
            done
          done
          # Clean up paths in checksums
          sed -i 's|[^ ]*/||' ../checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            checksums.txt
