# vt config — fallback for the VT_* environment variables.
#
# Copy this file to ~/.config/vt/config.toml and fill in your values:
#
#     mkdir -p ~/.config/vt
#     cp config.example.toml ~/.config/vt/config.toml
#     chmod 600 ~/.config/vt/config.toml      # holds secrets
#
# Precedence: an environment variable ALWAYS wins. A key here is used only
# when its matching VT_* env var is unset. Override the file location with the
# $VT_CONFIG environment variable.
#
# Only keys matching ^VT_[A-Z0-9_]+$ are honoured. Leave a line commented out
# (or delete it) to leave that variable unset.

# --- CF passkey ceremony (Linux servers + macOS fallback) -------------------
# Worker base URL for the phone-approval ceremony.
# VT_PASSKEY_URL = "https://vt.example.com"

# HMAC key signing /api/challenge requests. Must equal the worker's VT_AUTH_CF
# secret. SENSITIVE — keep this file mode 600.
# VT_PASSKEY_TOKEN = "your-passkey-token"

# --- SSH-agent path (macOS workstations running `vt ssh agent`) -------------
# When set (here or in the env — both are equivalent), the CLI verifies the
# agent path first (local socket, or one forwarded with `ssh -A`) and falls
# back to the passkey ceremony when it's unreachable or not a vt agent. This
# value is sensitive: keep this file private and mode 600. If one config is
# intentionally copied to agent-less hosts, pin VT_BACKEND=passkey there to
# skip the harmless local socket probe, but do not treat the token as public.
# SENSITIVE.
# VT_AUTH = "your-ssh-agent-token"

# --- Routing pin (optional) --------------------------------------------------
# auto (default): agent first when VT_AUTH is set, passkey fallback on
#                 recoverable errors.
# agent:          agent only — never fall back to the phone ceremony.
# passkey:        never probe the agent socket, even when VT_AUTH is set.
# One-shot override without editing this file: `VT_BACKEND=passkey vt …`,
# or `VT_AUTH= vt …` (empty env var beats the file and skips the agent).
# VT_BACKEND = "auto"

# --- git SSH signing identity (optional) ------------------------------------
# Prefer ~/.config/vt/git-ssh. These are raw values, not file paths. If the
# private record is set here, do not inherit it into an unrestricted `vt inject`
# command: inject scans vt:// values in the environment.
# Encrypted private key record and its matching public key.
# VT_GIT_SSH_PRIVATE_KEY = "vt://0..."
# VT_GIT_SSH_PUB = "ssh-ed25519 AAAA... vt-dev"

# --- AI-agent command hook (`vt hook`) --------------------------------------
# Command rules for `vt hook` do NOT live here. They contain no secrets and are
# meant to be synced, so they live in a separate file:
#
#     ~/.config/vt/agent.toml          (override with $VT_AGENT_CONFIG)
#
# See agent.example.toml for the template and docs/hook.md for the design.

# --- SSH agent defaults ([agent] section, optional) --------------------------
# Startup defaults for `vt ssh agent`, so a supervisor (the VT.app menu-bar
# shell) can spawn the agent without hardcoding your flags. Explicit CLI flags
# always override these; none of these keys is an environment variable.
# See docs/app-bundle.md §4.
# [agent]
# timeout = 300                      # idle seconds before keys are cleared
# ssh_auth_cache_duration = 0        # sign approval reuse seconds; 0 = always prompt
# decrypt_auth_cache_duration = 0    # decrypt approval reuse seconds; 0 = always prompt
# cache_hit_notify = true            # notify when a cached grant skips Touch ID
# run_allow = "/opt/homebrew/bin/zed"  # run@vt allowlist (comma-separated); unset disables run@vt
