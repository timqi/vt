<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="vt key icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#3b6ef0"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.26" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- drop shadow: dark key shapes, offset + translucent (cairosvg has no blur) -->
  <g transform="translate(0,7)" fill="#0b1b46" opacity="0.18">
    <polygon points="360,180 308,270 204,270 152,180 204,90 308,90"/>
    <rect x="235" y="250" width="42" height="162" rx="18"/>
    <rect x="276" y="330" width="40" height="24" rx="6"/>
    <rect x="276" y="372" width="26" height="24" rx="6"/>
  </g>

  <!-- the key (hex nut bow + shaft + teeth) -->
  <g fill="#f5f8ff">
    <polygon points="360,180 308,270 204,270 152,180 204,90 308,90"/>
    <rect x="235" y="250" width="42" height="162" rx="18"/>
    <rect x="276" y="330" width="40" height="24" rx="6"/>
    <rect x="276" y="372" width="26" height="24" rx="6"/>
  </g>

  <!-- keyhole "punched" by repainting the tile gradient at the same coords -->
  <g fill="url(#bg)">
    <circle cx="256" cy="166" r="30"/>
    <polygon points="240,182 272,182 282,246 230,246"/>
  </g>

  <!-- machined inner ring on the nut for a crypto/hardware feel -->
  <polygon points="332,180 294,246 218,246 180,180 218,114 294,114"
           fill="none" stroke="#2563eb" stroke-opacity="0.18" stroke-width="9"/>
</svg>
