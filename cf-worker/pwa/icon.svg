<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="vt key icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6da57"/>
      <stop offset="0.55" stop-color="#8cc653"/>
      <stop offset="1" stop-color="#52ab5b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.26" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- drop shadow: dark key shapes, offset + translucent (cairosvg has no blur) -->
  <g transform="translate(0,7)" fill="#14401c" opacity="0.18">
    <path d="M352.2,161.0 A34.0,34.0 0 0 1 352.2,195.0 L318.8,252.8 A34.0,34.0 0 0 1 289.4,269.8 L222.6,269.8 A34.0,34.0 0 0 1 193.2,252.8 L159.8,195.0 A34.0,34.0 0 0 1 159.8,161.0 L193.2,103.2 A34.0,34.0 0 0 1 222.6,86.2 L289.4,86.2 A34.0,34.0 0 0 1 318.8,103.2 Z"/>
    <rect x="236" y="248" width="40" height="168" rx="20"/>
    <rect x="258" y="320" width="64" height="30" rx="15"/>
    <rect x="258" y="366" width="50" height="30" rx="15"/>
  </g>

  <!-- the key (rounded hex nut bow + shaft + teeth) -->
  <g fill="#fafff5">
    <path d="M352.2,161.0 A34.0,34.0 0 0 1 352.2,195.0 L318.8,252.8 A34.0,34.0 0 0 1 289.4,269.8 L222.6,269.8 A34.0,34.0 0 0 1 193.2,252.8 L159.8,195.0 A34.0,34.0 0 0 1 159.8,161.0 L193.2,103.2 A34.0,34.0 0 0 1 222.6,86.2 L289.4,86.2 A34.0,34.0 0 0 1 318.8,103.2 Z"/>
    <rect x="236" y="248" width="40" height="168" rx="20"/>
    <rect x="258" y="320" width="64" height="30" rx="15"/>
    <rect x="258" y="366" width="50" height="30" rx="15"/>
  </g>

  <!-- keyhole "punched" by repainting the tile gradient at the same coords -->
  <g fill="url(#bg)">
    <circle cx="256" cy="162" r="31"/>
    <path d="M241.1,178.7 A13.0,13.0 0 0 1 253.9,168.0 L258.1,168.0 A13.0,13.0 0 0 1 270.9,178.7 L279.2,224.7 A13.0,13.0 0 0 1 266.4,240.0 L245.6,240.0 A13.0,13.0 0 0 1 232.8,224.7 Z"/>
  </g>

  <!-- machined inner ring on the nut for a crypto/hardware feel -->
  <path d="M322.5,165.0 A26.0,26.0 0 0 1 322.5,191.0 L300.5,229.1 A26.0,26.0 0 0 1 278.0,242.1 L234.0,242.1 A26.0,26.0 0 0 1 211.5,229.1 L189.5,191.0 A26.0,26.0 0 0 1 189.5,165.0 L211.5,126.9 A26.0,26.0 0 0 1 234.0,113.9 L278.0,113.9 A26.0,26.0 0 0 1 300.5,126.9 Z"
        fill="none" stroke="#4c9a2a" stroke-opacity="0.22" stroke-width="9"/>
</svg>
