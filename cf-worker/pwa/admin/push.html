<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VT — 推送</title>
  {{FAVICON_TAGS}}
  <link rel="stylesheet" href="{{ADMIN_BASE}}/pwa/admin.css?v={{ASSET_VER}}">
</head>
<body>
  <main>
    {{ADMIN_TABS}}
    <header class="page-head">
      <h1>推送</h1>
      <p class="hint">Web Push 直接送达本设备，无第三方。iOS 16.4+：Safari → 分享 → 添加到主屏幕，从图标打开本页再点「开启推送」；移除图标即停止推送。审批、enroll 与缓存命中（需 <code>CACHE_HIT_NOTIFY</code>）都走这里。</p>
    </header>
    <section id="actions">
      <button id="subscribe" type="button" disabled>开启推送</button>
      <input id="label" type="text" placeholder="设备名，如 iphone" maxlength="64">
      <span id="status" role="status" aria-live="polite"></span>
    </section>
    <div id="table-wrap"><table id="subs"><thead><tr>
      <th>设备</th><th>推送服务</th><th>订阅时间</th><th>操作</th>
    </tr></thead><tbody id="rows"></tbody></table></div>
  </main>
  <script src="/pwa/common.js"></script>
  <script src="{{ADMIN_BASE}}/pwa/push.js?v={{ASSET_VER}}"></script>
</body>
</html>
