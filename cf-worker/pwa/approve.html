<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <!-- Installed on iOS the system paints the status-bar strip in a grey that
       belongs to no part of the app. Translucent hands the strip to the page,
       which body's safe-area inset (admin.css) pays for. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>vt approval request</title>
  {{FAVICON_TAGS}}
  <!-- Two stylesheets, one paint. boot.css is ~1KB and render-blocking: it
       paints the heading and the loading state while the rest is still in
       flight. admin.css is parked at media="print" so it blocks nothing;
       approve.js waits for it, promotes it to 'all' and only then mounts the
       ceremony — a slow link shows the loading state, never white and never an
       unstyled approval. -->
  <link rel="stylesheet" href="/pwa/boot.css?v={{ASSET_VER}}">
  <link rel="stylesheet" id="vt-css" media="print" href="/pwa/admin/admin.css?v={{ASSET_VER}}">
</head>
<body>
  <script type="application/json" id="vt-data">{{VT_DATA}}</script>
  <main class="approve">
    <header>
      <h1>vt approval request</h1>
      <p class="hint">Confirm the operation below with a Passkey (iCloud / 1Password / YubiKey).</p>
      <!-- The page's own way out: opened from a notification it may sit in an
           in-app browser whose toolbar belongs to iOS, not to us. -->
      <nav class="approve-nav">
        <a href="/admin">Admin console</a>
        <button id="ap-reload" type="button">Refresh</button>
      </nav>
    </header>
    <!-- The ceremony UI (decision / details / cache selector / action bar) is
         built by approve.js's vt.mountApprove(), the single source shared with
         the admin audit sheet's inline approval. One solid card. -->
    <div id="vt-approve-root" class="card">
      <!-- Discarded by mountApprove()'s first act (root.innerHTML = ''). -->
      <p class="vt-boot" role="status">Loading approval request…</p>
      <p class="vt-boot-slow hint">Still loading — check the connection, then Refresh.</p>
    </div>
  </main>
  <script src="/pwa/common.js?v={{ASSET_VER}}"></script>
  <script src="/pwa/approve.js?v={{ASSET_VER}}"></script>
</body>
</html>
