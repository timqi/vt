# wrangler.test.toml — Worker config used ONLY by the vitest Workers pool.
#
# The real `wrangler.toml` is gitignored (it carries account/Access ids), so the
# Durable Object tests cannot depend on it being present. This file is the
# committed, deterministic equivalent: same entrypoint, same DO binding, same
# SQLite migration as `wrangler.toml.example`, with fixture values for the vars.
#
# EVERY secret-shaped value here is an obviously-fake, throwaway test fixture. It
# authorizes nothing anywhere: CACHE_SECKEY is a counting pattern, VT_AUTH_CF a
# literal, and the test credential (registered by `bootstrap()` in
# `test/do_helpers.ts`) is a keypair generated for this suite alone, so a full
# WebAuthn ceremony can be driven end-to-end offline. Never point this file at
# a real deployment.

name = "vt-passkey-test"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Same binding name + class the production config uses, so the DO under test is
# reached exactly the way index.ts reaches it (env.ACCOUNT).
[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "AccountDO"

# SQLite-backed DO: AccountDO's audit table lives in ctx.storage.sql.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountDO"]

# The one rate limiter (enroll, admin bootstrap, login-challenge), generous so
# the tests can drive several ceremonies per file; the fail-closed "binding
# absent" path is tested by deleting it from the env the router is invoked with.
[[unsafe.bindings]]
name = "ENROLL_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[vars]
WORKER_ORIGIN = "https://vt.test.invalid"
RP_ID = "vt.test.invalid"

# KEK over the root key the tests bootstrap; a literal, not a key.
VT_AUTH_CF = "test-kek-not-a-secret"

# Fake 32-byte X25519 secret (bytes 0x01..0x20, b64u) — a counting pattern, not a
# key anyone generated for use. The tests derive the matching public key from it
# at runtime via cachePublicKey(), exactly as the Worker does.
CACHE_SECKEY = "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA"

# Both cache toggles OFF by default: the tests that need them on set them
# explicitly, which is the point (a kill switch must be observable in both
# positions).
CACHE_HIT_NOTIFY = "0"
CACHE_ADMIN_EXTEND = "0"

# The same static-asset binding production uses (directory = pwa/), so a route
# test can prove which asset paths the Worker actually serves.
[assets]
directory = "pwa"
binding = "ASSETS"
run_worker_first = true
