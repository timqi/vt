[package]
name = "vt"
version = "2.3.0"
edition = "2021"
license = "MIT"
description = "Single-binary KMS with Touch ID / passkey approval — no plaintext secrets at rest, explicit authentication everywhere."
repository = "https://github.com/timqi/vt"

[[bin]]
name = "vt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.43", features = ["derive", "env"] }
# Narrowed from `full`. Every feature here backs a direct `tokio::*` use in
# this crate: rt-multi-thread (`runtime::Builder`, `spawn`), net (agent/relay
# sockets), time, macros (`#[tokio::main]`-style block_on tests, `select!`,
# `pin!`), process (`vt ssh connect` execs ssh), sync, signal (the macOS agent's
# shutdown handler) and fs. `io-util`/`io-std` are dropped: vt uses `std::io`
# everywhere and only dependencies pull the async IO traits in. `parking_lot`
# is dropped too — it only swaps tokio's internal mutex impl, and it costs 5
# crates in the tree.
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "net", "time", "macros", "process", "sync", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
aes-gcm = "0.10"
rand = "0.8"
anyhow = "1.0.98"
base64 = "0.22.1"
sha2 = "0.10.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.128", features = ["raw_value"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Already `toml`'s parser; used directly by `vt enroll` so a config rewrite
# keeps the operator's comments (no new crate).
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
totp-rs = "5.7.0"
rpassword = "7.4.0"
libc = "0.2.174"
# `agent`+`codec` enable the server-side Agent/Session traits used by the
# cross-platform ephemeral signer in `vt ssh connect` (must be on all unix).
ssh-agent-lib = { version = "0.5", default-features = false, features = ["agent", "codec"] }
async-trait = "0.1"
# Cross-platform SSH identity (vt ssh keygen/connect). macOS adds more features below.
ssh-key = { version = "0.6", features = ["ed25519"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
# CF ceremony (Linux / macOS fallback)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Sealed box v1 (docs/sealed-box-v1.md): X25519 here, HKDF/AES-GCM above.
# `static_secrets`: the daemon's ephemeral key opens the box AND verifies the
# binding, so it is used twice (EphemeralSecret is consumed by one exchange).
x25519-dalek = { version = "2", features = ["static_secrets"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# `OSX_10_13` gates `kSecUseAuthenticationContext` / `SecKeyCreateWithData`.
security-framework = { version = "3.3.0", features = ["OSX_10_13"] }
# Spike only: `SecKeyCreateWithData` for keychain-less SE keys (both already
# transitive via security-framework).
security-framework-sys = "2.14"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
block2 = "0.6"
# `encryption`: `vt ssh add` decrypts a passphrase-protected OpenSSH key.
ssh-key = { version = "0.6", features = ["ed25519", "encryption"] }
subtle = "2"

[dev-dependencies]
tracing-test = "0.2.5"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
