[package]
name = "vt"
version = "1.0.3"
edition = "2021"

[[bin]]
name = "vt"
path = "src/main.rs"

# One-shot migration tool from the legacy 4-item keychain layout
# (rusty.vault.{passcode,passphrase,ssh_keys,fido2_credentials}) to the
# consolidated rusty.vault.store. Not built by default; only relevant for
# users upgrading from a vt version that used the old layout.
#   cargo build --release --bin vt-migrate
#   ./target/release/vt-migrate
[[bin]]
name = "vt-migrate"
path = "src/bin/vt-migrate.rs"

[dependencies]
clap = { version = "4.5.43", features = ["derive", "env"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aes-gcm = "0.10"
rand = "0.8"
anyhow = "1.0.98"
base64 = "0.22.1"
sha2 = "0.10.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.128"
totp-rs = "5.7.0"
rpassword = "7.4.0"
regex = "1.11.1"
exec = "0.3.1"
libc = "0.2.174"
hostname = "0.4.1"
dirs = "5"
ssh-agent-lib = { version = "0.5", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.3.0"
localauthentication-rs = "0.1.0"
ssh-agent-lib = { version = "0.5", default-features = false, features = ["agent", "codec"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "encryption", "crypto"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
async-trait = "0.1"
subtle = "2"
zeroize = "1"
ctap-hid-fido2 = "3.5.9"

[dev-dependencies]
tracing-test = "0.2.5"
