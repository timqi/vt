[package]
name = "vt"
version = "2.3.0"
edition = "2021"
license = "MIT"
description = "Single-binary KMS with Touch ID / passkey approval — no plaintext secrets at rest, explicit authentication everywhere."
repository = "https://github.com/timqi/vt"

[[bin]]
name = "vt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.43", features = ["derive", "env"] }
# Narrowed from `full`. Every feature here backs a direct `tokio::*` use in
# this crate: rt-multi-thread (`runtime::Builder`, `spawn`), net (agent/relay
# sockets), time, macros (`#[tokio::main]`-style block_on tests, `select!`,
# `pin!`), process (`vt ssh connect` execs ssh), sync, signal (the macOS agent's
# shutdown handler) and fs. `io-util`/`io-std` are dropped: vt uses `std::io`
# everywhere and only dependencies pull the async IO traits in. `parking_lot`
# is dropped too — it only swaps tokio's internal mutex impl, and it costs 5
# crates in the tree.
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "net", "time", "macros", "process", "sync", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
aes-gcm = "0.10"
rand = "0.8"
anyhow = "1.0.98"
base64 = "0.22.1"
sha2 = "0.10.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.128", features = ["raw_value"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
totp-rs = "5.7.0"
rpassword = "7.4.0"
exec = "0.3.1"
libc = "0.2.174"
hostname = "0.4.1"
dirs = "5"
# `agent`+`codec` enable the server-side Agent/Session traits used by the
# cross-platform ephemeral signer in `vt ssh connect` (must be on all unix).
ssh-agent-lib = { version = "0.5", default-features = false, features = ["agent", "codec"] }
async-trait = "0.1"
# Cross-platform SSH identity (vt ssh keygen/connect). macOS adds more features below.
ssh-key = { version = "0.6", features = ["ed25519"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
# CF ceremony (Linux / macOS fallback)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dryoc = "0.8"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.3.0"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
block2 = "0.6"
ssh-agent-lib = { version = "0.5", default-features = false, features = ["agent", "codec"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "encryption", "crypto"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
async-trait = "0.1"
subtle = "2"
ctap-hid-fido2 = "3.5.9"

[dev-dependencies]
tracing-test = "0.2.5"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
